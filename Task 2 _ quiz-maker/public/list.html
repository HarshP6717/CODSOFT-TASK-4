<head>

    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">

        </div>

        <div id="allQuizzesSection">

    <script>
        window.onload = function() {
            loadMyQuizzes();
            loadAllQuizzes();
        };
